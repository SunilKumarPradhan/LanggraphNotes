title: LangGraph Lecture Notes
description: AI-generated lecture notes from transcripts
baseurl: /LanggraphNotes
url: https://SunilKumarPradhan.github.io

remote_theme: just-the-docs/just-the-docs

plugins:
  - jekyll-remote-theme

# Theme settings - Midnight Dark Theme
color_scheme: midnight
search_enabled: true
heading_anchors: true

# Search settings
search:
  heading_level: 3
  previews: 3
  preview_words_before: 5
  preview_words_after: 10
  tokenizer_separator: /[\s/]+/
  rel_url: true
  button: true

# Navigation
nav_sort: case_sensitive
nav_external_links:
  - title: GitHub
    url: https://github.com/SunilKumarPradhan/LanggraphNotes
    hide_icon: false

# Back to top button
back_to_top: true
back_to_top_text: "↑ Top"

# Callouts (for tips, warnings, etc.)
callouts:
  tip:
    title: 💡 Tip
    color: green
  note:
    title: 📝 Note
    color: blue
  warning:
    title: ⚠️ Warning
    color: yellow
  important:
    title: ❗ Important
    color: red

# Footer
footer_content: >-
  <span style="color: #8b949e;">🌙 Midnight Theme</span> • 
  Generated by <strong>NoteyBoy</strong> • 
  <a href="https://github.com/SunilKumarPradhan/LanggraphNotes">View Source</a>

# Aux links (top right)
aux_links:
  "⭐ Star on GitHub": "https://github.com/SunilKumarPradhan/LanggraphNotes"

aux_links_new_tab: true

# Compress HTML
compress_html:
  clippings: all
  comments: all
  endings: all
  startings: []
  blanklines: false
  profile: false